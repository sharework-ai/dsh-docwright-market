# docwright pack market on the local k3s.
#
# Applies after deploy/deploy.sh has created the namespace, the market-env
# secret (credentials lifted from the supabase namespace), and the shrwk-tls
# certificate copy. In-cluster wiring:
#   server  -> supabase-postgres.supabase.svc:5432   (DATABASE_URL)
#           -> supabase-envoy.supabase.svc:8000      (Auth/Storage REST)
#           -> verifier.market.svc:8399              (POST /verify)
#   traefik -> market.market.svc:8398               (dm.shrwk.com, TLS shrwk-tls)
---
apiVersion: v1
kind: Service
metadata:
  name: market
  namespace: market
spec:
  selector:
    app: market-server
  ports:
    - port: 8398
      targetPort: 8398
---
apiVersion: v1
kind: Service
metadata:
  name: verifier
  namespace: market
spec:
  selector:
    app: market-verifier
  ports:
    - port: 8399
      targetPort: 8399
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: market-server
  namespace: market
spec:
  replicas: 1
  selector:
    matchLabels:
      app: market-server
  template:
    metadata:
      labels:
        app: market-server
    spec:
      containers:
        - name: server
          image: localhost/market-server:__TAG__
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: market-env
          env:
            - name: LISTEN_HOST
              value: 0.0.0.0
            - name: PORT
              value: "8398"
            - name: WEB_DIR
              value: /app/web
            - name: DATA_DIR
              value: /tmp/market-data
          ports:
            - containerPort: 8398
          readinessProbe:
            httpGet: { path: /api/index, port: 8398 }
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests: { memory: 64Mi, cpu: 50m }
            limits: { memory: 256Mi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: market-verifier
  namespace: market
spec:
  replicas: 1
  selector:
    matchLabels:
      app: market-verifier
  template:
    metadata:
      labels:
        app: market-verifier
    spec:
      # Single-node k3s deployment: the verifier runs against the HOST's own
      # docwright + deepseek-harness checkouts via hostPath, so module
      # resolution is 1:1 with the machine where pack:check is proven.
      # (The node22-dev image just provides node; no code is baked in.)
      volumes:
        - name: docwright
          hostPath: { path: /home/sharework/projects/lab/docwright, type: Directory }
        - name: harness
          hostPath: { path: /home/sharework/projects/lab/deepseek-harness, type: Directory }
        - name: verifier-src
          hostPath: { path: /home/sharework/projects/lab/dsh-docwright-market/verifier, type: Directory }
      containers:
        - name: verifier
          image: localhost/node22-dev:1.1
          imagePullPolicy: IfNotPresent
          command: ["node", "/mnt/verifier/index.mjs"]
          workingDir: /mnt/docwright
          env:
            - name: DOCWRIGHT_ROOT
              value: /mnt/docwright
            - name: VERIFIER_PORT
              value: "8399"
            - name: VERIFIER_TMP
              value: /tmp/verifier
            - name: VERIFIER_HOST
              value: 0.0.0.0
          volumeMounts:
            - { name: docwright, mountPath: /mnt/docwright }
            - { name: harness, mountPath: /mnt/deepseek-harness }
            - { name: verifier-src, mountPath: /mnt/verifier }
          ports:
            - containerPort: 8399
          readinessProbe:
            httpGet: { path: /health, port: 8399 }
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests: { memory: 128Mi, cpu: 50m }
            limits: { memory: 512Mi }
---
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: market
  namespace: market
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`dm.shrwk.com`)
      kind: Rule
      services:
        - name: market
          port: 8398
  tls:
    secretName: shrwk-tls
