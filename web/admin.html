<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Review — docwright pack market</title>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <main>
    <h1 data-i18n="queue"></h1>
    <div id="auth-box" class="card">
      <label class="field"><span data-i18n="email"></span><input id="email" type="email" autocomplete="email"></label>
      <label class="field"><span data-i18n="password"></span><input id="password" type="password" autocomplete="current-password" minlength="6"></label>
      <div id="auth-error"></div>
      <button id="btn-signin" class="primary" data-i18n="signIn"></button>
      <p class="muted" style="font-size:0.82rem">Reviewing requires an admin profile (profiles.is_admin). <span lang="zh">审核页需要管理员账号(profiles.is_admin)。</span></p>
    </div>
    <div id="queue" class="hidden"></div>
    <h2 data-i18n="history" style="margin-top:2rem" class="hidden" id="history-title"></h2>
    <div id="history" class="hidden"></div>
  </main>
  <script src="/vendor/supabase.js"></script>
  <script src="/assets/app.js"></script>
  <script>
    MB.header('admin')

    document.getElementById('btn-signin').addEventListener('click', async () => {
      const email = document.getElementById('email').value.trim()
      const password = document.getElementById('password').value
      const box = document.getElementById('auth-error')
      if (!email || !password) {
        box.innerHTML = '<div class="notice bad">请填写邮箱和密码 / fill in email and password</div>'
        return
      }
      box.innerHTML = ''
      const { error } = await MB.supabase.auth.signInWithPassword({ email, password })
      if (error) alert(error.message)
      else load()
    })

    async function load() {
      const s = await MB.session()
      if (!s) return
      document.getElementById('auth-box').classList.add('hidden')
      document.getElementById('queue').classList.remove('hidden')
      loadHistory()
      const { queue } = await MB.api('/api/admin/queue', { auth: true })
      const el = document.getElementById('queue')
      if (!queue.length) {
        el.innerHTML = `<p class="muted" data-i18n="emptyQueue"></p>`
        MB.applyI18n()
        return
      }
      el.innerHTML = queue.map(item => `
        <div class="card" style="margin-bottom:1rem">
          <h3>${MB.esc(item.packName)}@${MB.esc(item.version)}
            <span class="chip ${item.kind === 'suite' ? 'active' : ''}">${MB.t(item.kind === 'suite' ? 'kindSuite' : 'kindPack')}</span>
            <span class="chip">${MB.esc(item.category || '')}</span>
            <span class="chip">${MB.esc(item.author || '')}</span>${item.kind === 'pack' ? ` <span class="chip">${MB.esc(item.license || '')}</span>` : ''}</h3>
          ${item.kind === 'suite' ? `
            <div class="desc">${MB.esc(MB.localizedDesc(item.suiteMeta?.description))}</div>
            <div class="meta">${(item.suiteMeta?.members || []).map(m => `<span class="chip">${MB.esc(m)}</span>`).join('')}</div>
            <details open><summary>${MB.t('suiteFormContent')}</summary>
              <pre class="sheet">${MB.esc(JSON.stringify(item.suiteMeta, null, 2))}</pre></details>
          ` : `
          ${item.report.hasFunctionRules ? `<div class="notice bad">${MB.esc(MB.t('functionsWarn'))}</div>` : ''}
          ${(item.report.problems || []).length ? `<div class="notice bad">${MB.esc(item.report.problems.join('\n'))}</div>` : ''}
          <details open><summary>manifest</summary>
            <pre class="sheet">${MB.esc(JSON.stringify(item.report.manifest, null, 2))}</pre></details>
          <details open><summary>files</summary>
            <pre class="sheet">${MB.esc((item.report.files || []).join('\n'))}</pre></details>
          <details open><summary>pack:check</summary>
            <pre class="sheet">${MB.esc(item.report.checkOutput || '')}</pre></details>
          `}
          <label class="field"><span data-i18n="note"></span><input id="note-${item.id}"></label>
          <button class="primary" data-id="${item.id}" data-action="approve">${MB.t('approve')}</button>
          <button class="danger" data-id="${item.id}" data-action="reject">${MB.t('reject')}</button>
        </div>`).join('')
      MB.applyI18n()
      el.querySelectorAll('button[data-id]').forEach(btn => btn.addEventListener('click', async () => {
        const note = document.getElementById(`note-${btn.dataset.id}`).value
        await MB.api(`/api/admin/review/${btn.dataset.id}`, {
          method: 'POST',
          auth: true,
          body: { action: btn.dataset.action, note: note || null },
        })
        load()
      }))
    }

    // Review history: every decided submission, newest first. Filter buttons
    // re-fetch; reload() re-renders the table from the cached rows.
    let historyRows = []
    let historyFilter = 'all'
    async function loadHistory() {
      const { reviews } = await MB.api(`/api/admin/reviews${historyFilter === 'all' ? '' : `?status=${historyFilter}`}`, { auth: true })
      historyRows = reviews
      renderHistory()
    }
    function renderHistory() {
      const title = document.getElementById('history-title')
      const el = document.getElementById('history')
      title.classList.remove('hidden')
      el.classList.remove('hidden')
      const filters = ['all', 'approved', 'rejected']
      const statusChip = s => `<span class="chip ${s === 'approved' ? 'active' : ''}">${MB.t(s)}</span>`
      el.innerHTML = `
        <div style="display:flex;gap:.5rem;margin-bottom:.75rem">
          ${filters.map(f => `<button class="${f === historyFilter ? 'primary' : ''}" data-filter="${f}">${MB.t('filter_' + f)}</button>`).join('')}
        </div>
        ${!historyRows.length ? `<p class="muted" data-i18n="emptyHistory"></p>` : `
        <table style="width:100%;border-collapse:collapse;font-size:.9rem">
          <thead><tr style="text-align:left;border-bottom:1px solid var(--border,#ddd)">
            <th data-i18n="th_time"></th><th data-i18n="status"></th><th data-i18n="th_target"></th>
            <th data-i18n="version"></th><th data-i18n="th_reviewer"></th><th data-i18n="note"></th>
          </tr></thead>
          <tbody>
          ${historyRows.map(r => `
            <tr style="border-bottom:1px solid var(--border,#eee)">
              <td style="padding:.4rem .5rem">${MB.esc((r.reviewedAt || r.createdAt || '').replace('T', ' '))}</td>
              <td style="padding:.4rem .5rem">${statusChip(r.status)}</td>
              <td style="padding:.4rem .5rem"><span class="chip ${r.kind === 'suite' ? 'active' : ''}">${MB.t(r.kind === 'suite' ? 'kindSuite' : 'kindPack')}</span> ${MB.esc(r.packName)}</td>
              <td style="padding:.4rem .5rem">${MB.esc(r.version)}</td>
              <td style="padding:.4rem .5rem">${MB.esc(r.reviewer || '—')}</td>
              <td style="padding:.4rem .5rem">${MB.esc(r.reviewNote || '—')}</td>
            </tr>`).join('')}
          </tbody>
        </table>`}`
      MB.applyI18n()
      el.querySelectorAll('button[data-filter]').forEach(btn => btn.addEventListener('click', () => {
        historyFilter = btn.dataset.filter
        loadHistory().catch(() => renderHistory())
      }))
    }

    load().catch(e => {
      // Non-admin (or signed out): keep the sign-in box visible.
      console.info(e.message)
    })
  </script>
</body>
</html>
