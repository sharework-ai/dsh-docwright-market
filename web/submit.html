<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Submit — docwright pack market</title>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <main>
    <p><a class="chip" href="/packs.html">← Packs</a></p>
    <h1 data-i18n="submitTitle"></h1>
    <p class="muted" data-i18n="submitHint"></p>

    <div id="auth-box" class="card">
      <label class="field"><span data-i18n="email"></span><input id="email" type="email" autocomplete="email"></label>
      <label class="field"><span data-i18n="password"></span><input id="password" type="password" autocomplete="current-password" minlength="6"></label>
      <div id="auth-error"></div>
      <button id="btn-signin" class="primary" data-i18n="signIn"></button>
      <button id="btn-signup" class="secondary" data-i18n="signUp"></button>
      <p class="muted" style="font-size:0.82rem" id="auth-hint">
        Sign-up confirms instantly on this host (no SMTP). <span lang="zh">本机自托管无邮件服务,注册即时生效。</span>
      </p>
    </div>

    <div id="form-box" class="hidden">
      <div id="org-gate" class="notice info hidden">
        <span data-i18n="orgGate"></span> <a href="/account.html" data-i18n="account"></a>
      </div>
      <div class="meta" style="margin-bottom:0.8rem">
        <button id="tab-pack" class="primary" data-i18n="tabPack"></button>
        <button id="tab-suite" class="secondary" data-i18n="tabSuite"></button>
      </div>
      <p id="suite-hint" class="muted hidden" style="font-size:0.85rem" data-i18n="suiteSubmitHint"></p>
      <form id="submit-form">
        <label class="field"><span data-i18n="archive"></span><input id="archive" type="file" accept=".tgz,.tar.gz,application/gzip" required></label>
        <label class="field"><span data-i18n="author"></span><input id="author" required></label>
        <label class="field"><span data-i18n="category"></span>
          <select id="category">
            <option value="estimation">estimation</option>
            <option value="dev" selected>dev</option>
            <option value="pm">pm</option>
            <option value="test">test</option>
            <option value="docs">docs</option>
            <option value="other">other</option>
          </select>
        </label>
        <label class="field"><span data-i18n="license"></span>
          <select id="license">
            <option value="MIT" selected>MIT</option>
            <option value="Apache-2.0">Apache-2.0</option>
            <option value="BSD-3-Clause">BSD-3-Clause</option>
            <option value="BSD-2-Clause">BSD-2-Clause</option>
            <option value="ISC">ISC</option>
          </select>
        </label>
        <label class="field"><span data-i18n="homepage"></span><input id="homepage" type="url" placeholder="https://…"></label>
        <button class="primary" type="submit" id="btn-send" data-i18n="send"></button>
      </form>
      <form id="suite-form" class="hidden">
        <label class="field"><span data-i18n="suiteName"></span><input id="su-name" placeholder="cosmic" required></label>
        <label class="field"><span data-i18n="suiteDescEn"></span><input id="su-desc-en" required></label>
        <label class="field"><span data-i18n="suiteDescZh"></span><input id="su-desc-zh"></label>
        <label class="field"><span data-i18n="suiteVersion"></span><input id="su-version" placeholder="1.0.0" required></label>
        <label class="field"><span data-i18n="category"></span>
          <select id="su-category">
            <option value="estimation" selected>estimation</option>
            <option value="dev">dev</option>
            <option value="pm">pm</option>
            <option value="test">test</option>
            <option value="docs">docs</option>
            <option value="other">other</option>
          </select>
        </label>
        <label class="field"><span data-i18n="suiteMembers"></span><input id="su-members" placeholder="cosmic-context cosmic-plan cosmic-req" required></label>
        <p class="muted" style="font-size:0.82rem" data-i18n="suiteMembersHint"></p>
        <button class="primary" type="submit" id="btn-suite-send" data-i18n="createSuite"></button>
      </form>
      <div id="result"></div>
    </div>
  </main>
  <script src="/vendor/supabase.js"></script>
  <script src="/assets/app.js"></script>
  <script>
    MB.header('submit')

    async function maybeShowForm() {
      const s = await MB.session()
      document.getElementById('auth-box').classList.toggle('hidden', !!s)
      document.getElementById('form-box').classList.toggle('hidden', !s)
      if (!s) return
      // Submitting requires a publisher org; without one the server would
      // 403 anyway, so gate the form up front (and prefill the author from
      // the org while we're here).
      const account = await MB.api('/api/account', { auth: true }).catch(() => null)
      const gated = !account?.org
      document.getElementById('org-gate').classList.toggle('hidden', !gated)
      document.getElementById('submit-form').classList.toggle('hidden', gated)
      document.getElementById('suite-form').classList.toggle('hidden', gated)
      if (account?.org && !document.getElementById('author').value) {
        document.getElementById('author').value = account.org
      }
    }

    // Two submission modes: PACK (upload a verified tarball) and SUITE (a
    // form — a suite is pure metadata, there is NO archive to upload; the
    // members must already be published packs). Both land in the SAME review
    // queue; pack.html's 我的管理 section tracks either kind's status.
    let mode = 'pack'
    function setMode(next) {
      mode = next
      document.getElementById('tab-pack').className = mode === 'pack' ? 'primary' : 'secondary'
      document.getElementById('tab-suite').className = mode === 'suite' ? 'primary' : 'secondary'
      document.getElementById('submit-form').classList.toggle('hidden', mode !== 'pack')
      document.getElementById('suite-form').classList.toggle('hidden', mode !== 'suite')
      document.getElementById('suite-hint').classList.toggle('hidden', mode !== 'suite')
      document.getElementById('result').innerHTML = ''
    }
    document.getElementById('tab-pack').addEventListener('click', () => setMode('pack'))
    document.getElementById('tab-suite').addEventListener('click', () => setMode('suite'))

    // Empty credentials reach GoTrue as an anonymous signup and die with
    // "Anonymous sign-ins are disabled" — validate before calling.
    function readCreds() {
      const email = document.getElementById('email').value.trim()
      const password = document.getElementById('password').value
      const box = document.getElementById('auth-error')
      if (!email || !password) {
        box.innerHTML = '<div class="notice bad">请先填写邮箱和密码(密码至少 6 位) / fill in email and password first</div>'
        return null
      }
      box.innerHTML = ''
      return { email, password }
    }

    document.getElementById('btn-signin').addEventListener('click', async () => {
      const creds = readCreds()
      if (!creds) return
      const { error } = await MB.supabase.auth.signInWithPassword(creds)
      if (error) alert(error.message)
      else maybeShowForm()
    })

    document.getElementById('btn-signup').addEventListener('click', async () => {
      const creds = readCreds()
      if (!creds) return
      if (creds.password.length < 6) {
        document.getElementById('auth-error').innerHTML =
          '<div class="notice bad">密码至少 6 位 / password needs at least 6 characters</div>'
        return
      }
      const { error } = await MB.supabase.auth.signUp(creds)
      if (error) alert(error.message)
      else { await MB.session(); maybeShowForm() }
    })

    document.getElementById('submit-form').addEventListener('submit', async event => {
      event.preventDefault()
      const result = document.getElementById('result')
      const file = document.getElementById('archive').files[0]
      if (!file) return
      const btn = document.getElementById('btn-send')
      btn.disabled = true
      btn.textContent = MB.t('verifying')
      result.innerHTML = ''
      try {
        const form = new FormData()
        form.append('archive', file)
        form.append('author', document.getElementById('author').value)
        form.append('category', document.getElementById('category').value)
        form.append('license', document.getElementById('license').value)
        form.append('homepage', document.getElementById('homepage').value)
        const res = await MB.api('/api/submissions', { method: 'POST', body: form, auth: true })
        if (res.ok) {
          result.innerHTML = `<div class="notice ok">${MB.t('accepted')}</div>
            <p><a href="#" id="status-link">${MB.t('refresh')}</a></p>`
          result.querySelector('#status-link').addEventListener('click', e => { e.preventDefault(); poll(res.id) })
        } else {
          result.innerHTML = `<div class="notice bad">${MB.t('rejectedMachine')}</div>
            ${renderReport(res.report)}`
        }
      } catch (e) {
        result.innerHTML = `<div class="notice bad">${MB.esc(e.message)}</div>`
      } finally {
        btn.disabled = false
        btn.textContent = MB.t('send')
      }
    })

    // SUITE submit: members are whitespace/comma separated pack names; the
    // server validates each against the packs table before queueing.
    document.getElementById('suite-form').addEventListener('submit', async event => {
      event.preventDefault()
      const result = document.getElementById('result')
      const btn = document.getElementById('btn-suite-send')
      const members = document.getElementById('su-members').value.split(/[\s,;]+/).filter(Boolean)
      if (!members.length) return
      const zhDesc = document.getElementById('su-desc-zh').value.trim()
      btn.disabled = true
      result.innerHTML = ''
      try {
        const res = await MB.api('/api/my/suites', {
          method: 'POST',
          auth: true,
          body: {
            name: document.getElementById('su-name').value.trim(),
            version: document.getElementById('su-version').value.trim(),
            description: Object.assign(
              { en: document.getElementById('su-desc-en').value.trim() },
              zhDesc ? { zh: zhDesc } : {}),
            category: document.getElementById('su-category').value,
            members,
          },
        })
        if (res.ok) {
          result.innerHTML = `<div class="notice ok">${MB.t('suiteQueued')}</div>
            <p><a href="/packs.html">${MB.t('trackInPacks')}</a></p>`
          document.getElementById('suite-form').reset()
        } else {
          result.innerHTML = `<div class="notice bad">${MB.esc(res.error || MB.t('rejectedMachine'))}</div>`
        }
      } catch (e) {
        result.innerHTML = `<div class="notice bad">${MB.esc(e.message)}</div>`
      } finally {
        btn.disabled = false
      }
    })

    async function poll(id) {
      const res = await MB.api(`/api/submissions/${id}`, { auth: true })
      document.getElementById('result').innerHTML = `
        <div class="notice ${res.status === 'approved' ? 'ok' : res.status === 'rejected' ? 'bad' : 'info'}">
          ${MB.t('status')}: ${MB.esc(res.status)}${res.reviewNote ? ' — ' + MB.esc(res.reviewNote) : ''}
        </div>${renderReport(res.report)}`
    }

    function renderReport(report) {
      if (!report) return ''
      const problems = (report.problems || [])
        .map(p => `<li>${MB.esc(p)}</li>`).join('')
      return `<section class="block">
        <pre class="sheet ${problems.length ? 'warn' : ''}">${MB.esc(problems ? 'PROBLEMS:\n' + report.problems.join('\n') + '\n\n' : '')}${MB.esc(report.checkOutput || '')}</pre>
      </section>`
    }

    maybeShowForm()
  </script>
</body>
</html>
