<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Submit — dsh-docwright market</title>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <main>
    <p><a class="chip" href="/packs.html" data-i18n="backPacks"></a></p>
    <h1 data-i18n="submitTitle"></h1>
    <p class="muted max-w-xl text-[13.5px]" data-i18n-html="submitZipHint"></p>

    <div id="auth-box" class="card">
      <label class="field"><span data-i18n="email"></span><input id="email" type="email" autocomplete="email"></label>
      <label class="field"><span data-i18n="password"></span><input id="password" type="password" autocomplete="current-password" minlength="6"></label>
      <div id="auth-error"></div>
      <button id="btn-signin" class="primary" data-i18n="signIn"></button>
      <button id="btn-signup" class="secondary" data-i18n="signUp"></button>
      <p class="muted text-xs" id="auth-hint" data-i18n-html="signupInstantHtml"></p>
    </div>

    <div id="form-box" class="hidden">
      <div id="org-gate" class="notice info hidden">
        <span data-i18n="orgGate"></span> <a href="/account.html" data-i18n="account"></a>
      </div>

      <!-- step 1: the zip IS the submission; kind is auto-detected -->
      <section class="block !my-4">
        <h2 class="text-base font-semibold" data-i18n="step1Archive"></h2>
        <label class="field !mt-2"><span data-i18n="archive"></span><input id="archive" type="file" accept=".zip,application/zip" required></label>
        <p class="muted text-[13px]" data-i18n="submitZipHint"></p>
        <div id="recognized" class="notice info hidden"></div>
      </section>

      <div id="bundle" class="hidden"></div>
      <div id="result"></div>
    </div>
  </main>
  <script src="/vendor/supabase.js"></script>
  <script src="/assets/app.js"></script>
  <script>
    MB.header('submit')

    const TAG_VALUES = ['general','business','it','finance','education','entertainment','media','healthcare','legal','engineering','other']

    function readCreds() {
      const email = document.getElementById('email').value.trim()
      const password = document.getElementById('password').value
      const box = document.getElementById('auth-error')
      if (!email || !password) {
        box.innerHTML = `<div class="notice bad">${MB.esc(MB.t('authFill'))} ${MB.esc(MB.t('authMin6'))}</div>`
        return null
      }
      box.innerHTML = ''
      return { email, password }
    }

    document.getElementById('btn-signin').addEventListener('click', async () => {
      const creds = readCreds()
      if (!creds) return
      const { error } = await MB.supabase.auth.signInWithPassword(creds)
      if (error) alert(error.message)
      else maybeShowForm()
    })

    document.getElementById('btn-signup').addEventListener('click', async () => {
      const creds = readCreds()
      if (!creds) return
      if (creds.password.length < 6) {
        document.getElementById('auth-error').innerHTML =
          `<div class="notice bad">${MB.esc(MB.t('authMin6'))}</div>`
        return
      }
      const { error } = await MB.supabase.auth.signUp(creds)
      if (error) alert(error.message)
      else { await MB.session(); maybeShowForm() }
    })

    let author = ''
    async function maybeShowForm() {
      const s = await MB.session()
      document.getElementById('auth-box').classList.toggle('hidden', !!s)
      document.getElementById('form-box').classList.toggle('hidden', !s)
      if (!s) return
      const account = await MB.api('/api/account', { auth: true }).catch(() => null)
      const gated = !account?.org
      document.getElementById('org-gate').classList.toggle('hidden', !gated)
      if (gated) return
      author = account.org
    }

    // ---- step 1 → 2: read the zip, classify, check versions ----
    let bundle = null // the detected { kind, ... } plus version statuses

    document.getElementById('archive').addEventListener('change', async event => {
      const file = event.target.files[0]
      if (!file) return
      const box = document.getElementById('recognized')
      const panel = document.getElementById('bundle')
      box.classList.remove('hidden')
      box.innerHTML = '…'
      panel.classList.add('hidden')
      panel.innerHTML = ''
      try {
        const entries = await MB.zipEntries(file)
        bundle = MB.detectBundle(entries)
        if (!bundle) throw new Error(MB.t('noBundle'))
        await enrichBundle()
        box.innerHTML = recognizedLine(bundle)
        renderBundle()
      } catch (e) {
        bundle = null
        box.innerHTML = `<span class="text-danger">${MB.esc(e.message)}</span>`
      }
    })

    function recognizedLine(b) {
      const kind = b.kind === 'suite' ? MB.t('bundleSuite') : MB.t('bundlePack')
      const name = b.kind === 'suite' ? b.manifest.name : b.packs.map(p => p.manifest.name).join(', ')
      return `${MB.esc(kind)}: <b>${MB.esc(name)}</b>`
    }

    // Attach market-version status to every code@version in the bundle.
    async function enrichBundle() {
      if (bundle.kind === 'suite') {
        bundle.status = await MB.versionStatus(bundle.manifest.name, bundle.manifest.version)
        bundle.members = []
        for (const name of bundle.manifest.members || []) {
          const version = bundle.memberVersions?.[name]
            || (bundle.entries.find(e => e.path === `${name}/manifest.json`)
              ? JSON.parse(new TextDecoder().decode(bundle.entries.find(e => e.path === `${name}/manifest.json`).bytes)).version
              : null)
          bundle.members.push({ name, version, ...(version ? await MB.versionStatus(name, version) : { state: 'missing', current: null }) })
        }
      } else {
        for (const p of bundle.packs) {
          p.status = await MB.versionStatus(p.manifest.name, p.manifest.version)
        }
      }
    }

    const STATUS_CLASS = { new: 'ok', update: 'info', unchanged: '', tooLow: 'bad', missing: 'bad' }

    function statusChip(state, current) {
      const cls = state === 'unchanged' ? 'chip' : `notice ${STATUS_CLASS[state] || ''} !inline-block !my-0 !py-0.5`
      const label = state === 'missing' ? MB.t('missingMember') : MB.t('status_' + state)
      return `<span class="${cls}">${MB.esc(label)}${current ? ` (@${MB.esc(current)})` : ''}</span>`
    }

    function renderBundle() {
      const panel = document.getElementById('bundle')
      if (bundle.kind === 'suite') renderSuite()
      else renderPacks()
      panel.classList.remove('hidden')
    }

    // ---- suite bundle: display + one confirm button ----
    function renderSuite() {
      const panel = document.getElementById('bundle')
      const m = bundle.manifest
      const blocked = bundle.status.state === 'tooLow'
      const memberRows = bundle.members.map(mem => `
        <tr>
          <td class="font-mono">${MB.esc(mem.name)}</td>
          <td class="font-mono">@${MB.esc(mem.version ?? '—')}</td>
          <td>${statusChip(mem.state, mem.current)}</td>
        </tr>`).join('')
      panel.innerHTML = `
        <section class="block !my-4">
          <h2 class="text-base font-semibold">${MB.esc(MB.t('bundleSuite'))}: ${MB.esc(m.name)}<span class="font-mono text-[13px] font-semibold text-primary dark:text-accent-strong">@${MB.esc(m.version)}</span></h2>
          <p class="muted text-[13px]">${MB.esc(MB.t('versionRule'))}</p>
          <table class="kv max-w-xl">
            <tr><td>${MB.esc(MB.t('membersLabel'))}</td><td class="font-mono">${MB.esc((m.members || []).join(', '))}</td></tr>
            <tr><td>${MB.esc(MB.t('category'))}</td><td class="font-mono">${MB.esc((m.tags || []).join(', '))}</td></tr>
          </table>
          <table class="kv max-w-xl"><thead><tr><th>${MB.t('memberPacks')}</th><th>version</th><th>status</th></tr></thead><tbody>${memberRows}</tbody></table>
          <div id="suite-msg"></div>
          <button id="btn-suite-send" class="primary mt-3" type="button" ${blocked ? 'disabled' : ''} data-i18n="submitAll"></button>
          ${blocked ? `<p class="notice bad !inline-block">${MB.esc(MB.t('statusTooLow'))}</p>` : ''}
        </section>`
      document.getElementById('btn-suite-send').addEventListener('click', submitSuite)
    }

    async function submitSuite() {
      const msg = document.getElementById('suite-msg')
      const btn = document.getElementById('btn-suite-send')
      const m = bundle.manifest
      btn.disabled = true
      try {
        // Member packs with a HIGHER version than the market are submitted
        // first (machine verify + review), then the suite form itself.
        for (const mem of bundle.members.filter(x => x.state === 'update')) {
          msg.innerHTML = `<div class="notice info">${MB.esc(MB.t('submittingItem').replaceAll('{name}', MB.esc(mem.name)))}</div>`
          const files = bundle.entries.filter(e => e.path.startsWith(mem.name + '/'))
          const tgz = await MB.makeTarGz(files.map(e => ({ path: e.path.slice(mem.name.length + 1), bytes: e.bytes })))
          const form = new FormData()
          form.append('archive', new File([tgz], `${mem.name}-${mem.version}.tgz`), `${mem.name}-${mem.version}.tgz`)
          const memberManifest = JSON.parse(new TextDecoder().decode(
            bundle.entries.find(e => e.path === `${mem.name}/manifest.json`).bytes))
          form.append('author', memberManifest.author || author)
          form.append('tags', (memberManifest.tags || ['other']).join(','))
          form.append('license', memberManifest.license || 'MIT')
          form.append('homepage', memberManifest.homepage || '')
          await MB.api('/api/submissions', { method: 'POST', body: form, auth: true })
        }
        msg.innerHTML = `<div class="notice info">${MB.esc(MB.t('submittingItem').replaceAll('{name}', MB.esc(m.name)))}</div>`
        const zhDesc = m.description?.zh || ''
        await MB.api('/api/my/suites', {
          method: 'POST', auth: true,
          body: {
            name: m.name,
            version: m.version,
            description: Object.assign({ en: m.description?.en || '' }, zhDesc ? { zh: zhDesc } : {}),
            title: m.title || null,
            tags: m.tags || ['other'],
            members: m.members || [],
          },
        })
        msg.innerHTML = `<div class="notice ok">${MB.esc(MB.t('suiteQueued'))}
          <p><a href="/packs.html">${MB.t('trackInPacks')}</a></p></div>`
      } catch (e) {
        msg.innerHTML = `<div class="notice bad">${MB.esc(e.message)}</div>`
      } finally {
        btn.disabled = false
      }
    }

    // ---- pack bundle(s): metadata confirmed from the manifest, one tgz each ----
    function renderPacks() {
      const panel = document.getElementById('bundle')
      panel.innerHTML = bundle.packs.map((p, i) => {
        const m = p.manifest
        const blocked = p.status.state === 'tooLow'
        return `
        <section class="block !my-4" data-pack-index="${i}">
          <h2 class="text-base font-semibold">${MB.esc(MB.displayTitle(m) !== m.name ? MB.displayTitle(m) + ' — ' : '')}${MB.esc(m.name)}<span class="font-mono text-[13px] font-semibold text-primary dark:text-accent-strong">@${MB.esc(m.version)}</span> ${statusChip(p.status.state, p.status.current)}</h2>
          <p class="muted text-[13px]" data-i18n="lockedFromArchive"></p>
          <label class="field"><span data-i18n="author"></span><input class="f-author" value="${MB.esc(m.author || author || '')}" ${m.author ? 'disabled' : 'required'}></label>
          <label class="field"><span data-i18n="license"></span><input class="f-license" value="${MB.esc(m.license || 'MIT')}" ${m.license ? 'disabled' : ''}></label>
          <label class="field"><span data-i18n="homepage"></span><input class="f-homepage" type="url" value="${MB.esc(m.homepage || '')}" ${m.homepage ? 'disabled' : ''}></label>
          <div class="e-msg"></div>
          <button class="primary f-send" type="button" ${blocked ? 'disabled' : ''} data-i18n="submitAll"></button>
        </section>`
      }).join('')
      panel.querySelectorAll('[data-pack-index]').forEach(section => {
        const p = bundle.packs[Number(section.dataset.packIndex)]
        section.querySelector('.f-send').addEventListener('click', e => submitPack(p, section, e.target))
      })
    }

    async function submitPack(p, section, btn) {
      const msg = section.querySelector('.e-msg')
      const m = p.manifest
      btn.disabled = true
      try {
        msg.innerHTML = `<div class="notice info">${MB.esc(MB.t('submittingItem').replaceAll('{name}', MB.esc(m.name)))}</div>`
        const files = p.dir ? p.files.map(e => ({ path: e.path.slice(p.dir.length + 1), bytes: e.bytes }))
                            : p.files.map(e => ({ path: e.path, bytes: e.bytes }))
        const tgz = await MB.makeTarGz(files)
        const form = new FormData()
        form.append('archive', new File([tgz], `${m.name}-${m.version}.tgz`), `${m.name}-${m.version}.tgz`)
        form.append('author', section.querySelector('.f-author').value)
        form.append('tags', (m.tags || ['other']).join(','))
        form.append('license', section.querySelector('.f-license').value)
        form.append('homepage', section.querySelector('.f-homepage').value)
        const res = await MB.api('/api/submissions', { method: 'POST', body: form, auth: true })
        if (res.ok) {
          msg.innerHTML = `<div class="notice ok">${MB.esc(MB.t('accepted'))}
            <p><a href="/packs.html">${MB.t('trackInPacks')}</a></p></div>`
        } else {
          msg.innerHTML = `<div class="notice bad">${MB.t('rejectedMachine')}</div>${renderReport(res.report)}`
        }
      } catch (e) {
        msg.innerHTML = `<div class="notice bad">${MB.esc(e.message)}</div>`
      } finally {
        btn.disabled = false
      }
    }

    function renderReport(report) {
      if (!report) return ''
      const problems = (report.problems || [])
        .map(p => `<li>${MB.esc(p)}</li>`).join('')
      return `<section class="block">
        <pre class="sheet ${problems.length ? 'warn' : ''}">${MB.esc(problems ? 'PROBLEMS:\n' + report.problems.join('\n') + '\n\n' : '')}${MB.esc(report.checkOutput || '')}</pre>
      </section>`
    }

    maybeShowForm()
  </script>
</body>
</html>
