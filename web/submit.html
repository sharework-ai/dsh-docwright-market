<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Submit — docwright pack market</title>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <main>
    <p><a class="chip" href="/packs.html" data-i18n="backPacks"></a></p>
    <h1 data-i18n="submitTitle"></h1>
    <p class="muted" data-i18n="submitHint"></p>

    <div id="auth-box" class="card">
      <label class="field"><span data-i18n="email"></span><input id="email" type="email" autocomplete="email"></label>
      <label class="field"><span data-i18n="password"></span><input id="password" type="password" autocomplete="current-password" minlength="6"></label>
      <div id="auth-error"></div>
      <button id="btn-signin" class="primary" data-i18n="signIn"></button>
      <button id="btn-signup" class="secondary" data-i18n="signUp"></button>
      <p class="muted text-xs" id="auth-hint" data-i18n-html="signupInstantHtml"></p>
    </div>

    <div id="form-box" class="hidden">
      <div id="org-gate" class="notice info hidden">
        <span data-i18n="orgGate"></span> <a href="/account.html" data-i18n="account"></a>
      </div>
      <div class="tabs">
        <button id="tab-pack" class="active" type="button" data-i18n="tabPack"></button>
        <button id="tab-suite" type="button" data-i18n="tabSuite" title="${''}"></button>
      </div>
      <form id="submit-form">
        <section class="block !my-4">
          <h2 class="text-base font-semibold" data-i18n="step1Archive"></h2>
          <label class="field !mt-2"><span data-i18n="archive"></span><input id="archive" type="file" accept=".tgz,.tar.gz,application/gzip" required></label>
          <div id="recognized" class="notice info hidden"></div>
        </section>
        <section id="meta-step" class="block !my-4 hidden">
          <h2 class="text-base font-semibold" data-i18n="confirmStep"></h2>
          <p class="muted text-[13px]" id="locked-note" data-i18n="lockedFromArchive"></p>
          <label class="field"><span data-i18n="author"></span><input id="author" required></label>
          <label class="field"><span data-i18n="category"></span>
            <select id="category">
              <option value="general">general</option>
              <option value="business">business</option>
              <option value="it" selected>it</option>
              <option value="finance">finance</option>
              <option value="education">education</option>
              <option value="entertainment">entertainment</option>
              <option value="media">media</option>
              <option value="healthcare">healthcare</option>
              <option value="legal">legal</option>
              <option value="engineering">engineering</option>
              <option value="other">other</option>
            </select>
          </label>
          <label class="field"><span data-i18n="license"></span>
            <select id="license">
              <option value="MIT" selected>MIT</option>
              <option value="Apache-2.0">Apache-2.0</option>
              <option value="BSD-3-Clause">BSD-3-Clause</option>
              <option value="BSD-2-Clause">BSD-2-Clause</option>
              <option value="ISC">ISC</option>
            </select>
          </label>
          <label class="field"><span data-i18n="homepage"></span><input id="homepage" type="url" placeholder="https://…"></label>
          <button class="primary" type="submit" id="btn-send" data-i18n="send"></button>
        </section>
      </form>
      <div id="result"></div>
    </div>
  </main>
  <script src="/vendor/supabase.js"></script>
  <script src="/assets/app.js"></script>
  <script>
    MB.header('submit')

    async function maybeShowForm() {
      const s = await MB.session()
      document.getElementById('auth-box').classList.toggle('hidden', !!s)
      document.getElementById('form-box').classList.toggle('hidden', !s)
      if (!s) return
      // Submitting requires a publisher org; without one the server would
      // 403 anyway, so gate the form up front (and prefill the author from
      // the org while we're here).
      const account = await MB.api('/api/account', { auth: true }).catch(() => null)
      const gated = !account?.org
      document.getElementById('org-gate').classList.toggle('hidden', !gated)
      document.getElementById('submit-form').classList.toggle('hidden', gated)
      if (account?.org && !document.getElementById('author').value) {
        document.getElementById('author').value = account.org
      }
    }

    // Two submission modes: PACK (upload a verified tarball) and SUITE (a
    // form — a suite is pure metadata, there is NO archive to upload; the
    // members must already be published packs). Both land in the SAME review
    // queue; pack.html's 我的管理 section tracks either kind's status.
    let mode = 'pack'
    function setMode(next) {
      mode = next
      document.getElementById('tab-pack').classList.toggle('active', mode === 'pack')
      document.getElementById('tab-suite').classList.toggle('active', mode === 'suite')
      document.getElementById('submit-form').classList.toggle('hidden', mode !== 'pack')
      document.getElementById('result').innerHTML = ''
    }
    document.getElementById('tab-pack').addEventListener('click', () => setMode('pack'))
    // Suite submissions live on the dedicated maintenance page (metadata
    // + member picking there); this tab simply hands off to it.
    document.getElementById('tab-suite').addEventListener('click', () => { location.href = '/suite-edit.html' })

    // Upload-first flow: as soon as an archive is chosen, read manifest.json
    // straight out of the tgz in the browser (gzip via DecompressionStream +
    // a minimal ustar walker) and show the recognized identity, so the user
    // CONFIRMS metadata on top of a real archive instead of filling a form
    // blind. The server-side machine verification stays the source of truth.
    async function extractManifest(file) {
      const reader = file.stream().pipeThrough(new DecompressionStream('gzip')).getReader()
      const chunks = []
      let total = 0
      for (;;) {
        const { done, value } = await reader.read()
        if (done) break
        chunks.push(value)
        total += value.length
        if (total > 64 * 1024 * 1024) break // sanity cap
      }
      const bytes = new Uint8Array(total)
      let off = 0
      for (const c of chunks) { bytes.set(c, off); off += c.length }
      // minimal ustar walk: 512-byte headers, find the manifest.json entry
      for (let pos = 0; pos + 512 <= bytes.length;) {
        const header = bytes.subarray(pos, pos + 512)
        if (header.every(b => b === 0)) break
        let name = ''
        for (let i = 0; i < 100 && header[i] !== 0; i++) name += String.fromCharCode(header[i])
        const sizeField = new TextDecoder().decode(header.subarray(124, 136)).replace(/[\0 ]/g, '')
        const size = parseInt(sizeField || '0', 8) || 0
        const dataStart = pos + 512
        const clean = name.replace(/^\.\//, '')
        if (clean === 'manifest.json' || clean.endsWith('/manifest.json')) {
          return JSON.parse(new TextDecoder().decode(bytes.subarray(dataStart, dataStart + size)))
        }
        pos = dataStart + Math.ceil(size / 512) * 512
      }
      return null
    }

    // Metadata carried by manifest.json is shown LOCKED (author, category,
    // license, homepage); anything the manifest omits stays editable — the
    // market needs at least an author, so silent blanks would only 403 later.
    function fillMetaFromManifest(manifest) {
      const bind = (id, value, lock) => {
        const el = document.getElementById(id)
        el.value = value ?? ''
        el.disabled = lock
      }
      bind('author', manifest?.author, manifest?.author !== undefined)
      bind('category', manifest?.category, manifest?.category !== undefined)
      bind('license', manifest?.license, manifest?.license !== undefined)
      bind('homepage', manifest?.homepage, manifest?.homepage !== undefined)
      document.getElementById('locked-note').classList.toggle('hidden', !manifest?.author && manifest?.category === undefined && manifest?.license === undefined && manifest?.homepage === undefined)
      document.getElementById('meta-step').classList.remove('hidden')
    }

    function showRecognized(manifest) {
      const box = document.getElementById('recognized')
      if (!manifest?.name) {
        box.innerHTML = MB.esc(MB.t('recognizedUnknown'))
        box.classList.remove('hidden')
        fillMetaFromManifest(null)
        return
      }
      const desc = manifest.description ? MB.esc(typeof manifest.description === 'string' ? manifest.description : (manifest.description.en || manifest.description.zh || '')) : ''
      box.innerHTML = MB.t('recognizedHtml').replaceAll('{name}', MB.esc(manifest.name)).replaceAll('{version}', MB.esc(manifest.version || ''))
        + (desc ? '<br>' + MB.t('recognizedDesc').replaceAll('{desc}', desc) : '')
      box.classList.remove('hidden')
      fillMetaFromManifest(manifest)
    }

    document.getElementById('archive').addEventListener('change', async event => {
      const file = event.target.files[0]
      if (!file) return
      const box = document.getElementById('recognized')
      box.classList.remove('hidden')
      box.innerHTML = '…'
      try {
        showRecognized(await extractManifest(file))
      } catch {
        showRecognized(null)
      }
    })

    // Empty credentials reach GoTrue as an anonymous signup and die with
    // "Anonymous sign-ins are disabled" — validate before calling.
    function readCreds() {
      const email = document.getElementById('email').value.trim()
      const password = document.getElementById('password').value
      const box = document.getElementById('auth-error')
      if (!email || !password) {
        box.innerHTML = `<div class="notice bad">${MB.esc(MB.t('authFill'))} ${MB.esc(MB.t('authMin6'))}</div>`
        return null
      }
      box.innerHTML = ''
      return { email, password }
    }

    document.getElementById('btn-signin').addEventListener('click', async () => {
      const creds = readCreds()
      if (!creds) return
      const { error } = await MB.supabase.auth.signInWithPassword(creds)
      if (error) alert(error.message)
      else maybeShowForm()
    })

    document.getElementById('btn-signup').addEventListener('click', async () => {
      const creds = readCreds()
      if (!creds) return
      if (creds.password.length < 6) {
        document.getElementById('auth-error').innerHTML =
          `<div class="notice bad">${MB.esc(MB.t('authMin6'))}</div>`
        return
      }
      const { error } = await MB.supabase.auth.signUp(creds)
      if (error) alert(error.message)
      else { await MB.session(); maybeShowForm() }
    })

    document.getElementById('submit-form').addEventListener('submit', async event => {
      event.preventDefault()
      const result = document.getElementById('result')
      const file = document.getElementById('archive').files[0]
      if (!file) return
      const btn = document.getElementById('btn-send')
      btn.disabled = true
      btn.textContent = MB.t('verifying')
      result.innerHTML = ''
      try {
        const form = new FormData()
        form.append('archive', file)
        form.append('author', document.getElementById('author').value)
        form.append('category', document.getElementById('category').value)
        form.append('license', document.getElementById('license').value)
        form.append('homepage', document.getElementById('homepage').value)
        const res = await MB.api('/api/submissions', { method: 'POST', body: form, auth: true })
        if (res.ok) {
          result.innerHTML = `<div class="notice ok">${MB.t('accepted')}</div>
            <p><a href="#" id="status-link">${MB.t('refresh')}</a></p>`
          result.querySelector('#status-link').addEventListener('click', e => { e.preventDefault(); poll(res.id) })
        } else {
          result.innerHTML = `<div class="notice bad">${MB.t('rejectedMachine')}</div>
            ${renderReport(res.report)}`
        }
      } catch (e) {
        result.innerHTML = `<div class="notice bad">${MB.esc(e.message)}</div>`
      } finally {
        btn.disabled = false
        btn.textContent = MB.t('send')
      }
    })

    async function poll(id) {
      const res = await MB.api(`/api/submissions/${id}`, { auth: true })
      document.getElementById('result').innerHTML = `
        <div class="notice ${res.status === 'approved' ? 'ok' : res.status === 'rejected' ? 'bad' : 'info'}">
          ${MB.t('status')}: ${MB.esc(res.status)}${res.reviewNote ? ' — ' + MB.esc(res.reviewNote) : ''}
        </div>${renderReport(res.report)}`
    }

    function renderReport(report) {
      if (!report) return ''
      const problems = (report.problems || [])
        .map(p => `<li>${MB.esc(p)}</li>`).join('')
      return `<section class="block">
        <pre class="sheet ${problems.length ? 'warn' : ''}">${MB.esc(problems ? 'PROBLEMS:\n' + report.problems.join('\n') + '\n\n' : '')}${MB.esc(report.checkOutput || '')}</pre>
      </section>`
    }

    maybeShowForm()
  </script>
</body>
</html>
