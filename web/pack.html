<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>docwright pack market</title>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <main id="main">
    <p class="muted">Loading…</p>
  </main>
  <script src="/vendor/supabase.js"></script>
  <script src="/assets/app.js"></script>
  <script>
    const name = new URLSearchParams(location.search).get('name')

    function render({ pack, versions, health }) {
      if (!pack) {
        document.getElementById('main').innerHTML = `<h1>${MB.t('packNotFound')}</h1>`
        return
      }
      const desc = MB.esc(MB.localizedDesc(pack.description))
      document.title = `${pack.name} — docwright pack market`
      const versionRows = (versions || []).map(v => `
        <tr>
          <td>${MB.esc(v.version)}</td>
          <td>${MB.esc(v.publishedAt)}</td>
          <td><a href="${MB.esc(v.tarball)}" download>${MB.t('download')}</a></td>
        </tr>`).join('')
      document.getElementById('main').innerHTML = `
        <h1>${MB.esc(pack.name)} <span class="muted">@${MB.esc(pack.version)}</span>
          ${pack.org ? `<span class="chip">org: ${MB.esc(pack.org)}</span>` : ''}</h1>
        <p>${desc}</p>
        ${pack.hasFunctionRules ? `<div class="notice bad">${MB.esc(MB.t('functionsWarn'))}</div>` : ''}
        <section class="block">
          <table class="kv">
            <tr><td>${MB.t('version')}</td><td>${MB.esc(pack.version)}</td></tr>
            <tr><td>${MB.t('author')}</td><td>${MB.esc(pack.author)}</td></tr>
            <tr><td>org</td><td>${MB.esc(pack.org || '—')}</td></tr>
            <tr><td>${MB.t('category')}</td><td>${MB.esc(pack.category)}</td></tr>
            <tr><td>${MB.t('license')}</td><td>${MB.esc(pack.license)}</td></tr>
            <tr><td>${MB.t('consumes')}</td><td>${MB.esc((pack.consumes || []).join(', ')) || '—'}</td></tr>
            <tr><td>${MB.t('languages')}</td><td>${MB.esc((pack.languages || []).join(', '))}</td></tr>
            <tr><td>${MB.t('requiresTopic')}</td><td>${pack.requiresTopic ? 'yes' : 'no'}</td></tr>
            <tr><td>${MB.t('artifactPrefix')}</td><td>${MB.esc(pack.artifactPrefix || '—')}</td></tr>
            <tr><td>${MB.t('added')}</td><td>${MB.esc(pack.added)}</td></tr>
            <tr><td>${MB.t('updated')}</td><td>${MB.esc(pack.updated)}</td></tr>
          </table>
        </section>
        ${versionRows ? `
        <section class="block">
          <h2>${MB.t('versionsLabel')}</h2>
          <table class="kv">${versionRows}</table>
        </section>` : ''}
        <section class="block">
          <h2>${MB.t('install')}</h2>
          <p class="muted" style="font-size:0.9rem">
            In a DSH session with the docwright plugin, just ask:
            <strong>“帮我安装 ${MB.esc(pack.name)}”</strong> (or “install ${MB.esc(pack.name)}”).
            The model finds this pack and installs it after your confirmation — it is usable in the same
            session, no restart.
            <span lang="zh">在装有 docwright 插件的 DSH 会话中直接说<strong>“帮我安装 ${MB.esc(pack.name)}”</strong>即可：
            模型会找到本包并在你确认后安装，装完当前会话立即可用，无需重启。</span>
          </p>
          <details class="muted" style="font-size:0.85rem">
            <summary>CLI (outside a DSH session)</summary>
            <code class="cmd">node install.mjs ${MB.esc(pack.name)} --index ${MB.esc(location.origin)}/api/index</code>
            <p>
              Copies the pack into <code>./.docwright/packs/</code> (or pass <code>--into</code>), then restart the
              dsh host and check with <code>doc_packs</code>. Pin a version with
              <code>node install.mjs ${MB.esc(pack.name)}@0.1.0</code>.
              <span lang="zh">拷入 <code>./.docwright/packs/</code>(可用 <code>--into</code> 指定),重启宿主后用
              <code>doc_packs</code> 确认可见;<code>name@版本号</code> 可安装指定历史版本。</span>
            </p>
          </details>
          <p><a href="${MB.esc(pack.tarball)}" download>${MB.t('download')}</a></p>
        </section>
        ${health ? `
        <section class="block">
          <h2>${MB.t('healthSheet')}</h2>
          <pre class="sheet">${MB.esc(health)}</pre>
        </section>` : ''}`

      MB.header('browse')
    }

    MB.header('browse')
    if (!name) {
      location.href = '/'
    } else {
      MB.api(`/api/packs/${encodeURIComponent(name)}`)
        .then(render)
        .catch(e => {
          document.getElementById('main').innerHTML = `<p class="notice bad">${MB.esc(e.message)}</p>`
          MB.header('browse')
        })
    }
  </script>
</body>
</html>
