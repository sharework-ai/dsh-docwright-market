<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>docwright pack market</title>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <main id="main">
    <p class="muted" data-i18n="loading"></p>
  </main>
  <script src="/vendor/supabase.js"></script>
  <script src="/assets/app.js"></script>
  <script>
    const name = new URLSearchParams(location.search).get('name')

    function render({ pack, versions, health }) {
      const suiteLinks = (pack.suites || []).map(st =>
        `<a class="chip" href="/suite.html?name=${encodeURIComponent(st)}">${MB.esc(st)}</a>`).join('')
      if (!pack) {
        document.getElementById('main').innerHTML = `<h1>${MB.t('packNotFound')}</h1>`
        return
      }
      const desc = MB.esc(MB.localizedDesc(pack.description))
      document.title = `${pack.name} — docwright pack market`
      const versionRows = (versions || []).map(v => `
        <tr>
          <td class="font-mono">${MB.esc(v.version)}</td>
          <td>${MB.esc(v.publishedAt)}</td>
          <td><a href="${MB.esc(v.tarball)}" download>${MB.t('download')}</a></td>
        </tr>`).join('')
      document.getElementById('main').innerHTML = `
        <p><a class="chip" href="/">← ${MB.t('browse')}</a></p>
        <h1>${MB.esc(pack.name)}
          <span class="font-mono text-2xl font-semibold text-primary dark:text-accent-strong">@${MB.esc(pack.version)}</span>
          ${pack.org ? `<span class="chip align-middle">org: ${MB.esc(pack.org)}</span>` : ''}</h1>
        <p class="max-w-xl text-slate-500 dark:text-slate-400">${desc}</p>
        ${suiteLinks ? `<div class="meta"><span class="muted text-sm">${MB.t('belongsTo')}:</span> ${suiteLinks}</div>` : ''}
        ${pack.hasFunctionRules ? `<div class="notice bad max-w-xl">${MB.esc(MB.t('functionsWarn'))}</div>` : ''}
        ${health ? `
        <section class="block">
          <h2>${MB.t('healthSheet')}</h2>
          <pre class="sheet max-w-2xl">${MB.esc(health)}</pre>
        </section>` : ''}
        <section class="block">
          <h2>${MB.t('install')}</h2>
          <p class="max-w-xl text-[13.5px] text-slate-500 dark:text-slate-400" data-i18n-html="installDshHtml" data-i18n-args="name:${MB.esc(pack.name)}"></p>
          <code class="cmd max-w-2xl">node install.mjs ${MB.esc(pack.name)} --index ${MB.esc(location.origin)}/api/index</code>
          <details class="max-w-2xl">
            <summary data-i18n="cliSummary"></summary>
            <p class="text-[13px] text-slate-500 dark:text-slate-400" data-i18n-html="cliDetailsHtml" data-i18n-args="name:${MB.esc(pack.name)}"></p>
          </details>
          <p class="mt-4"><a class="btn" href="${MB.esc(pack.tarball)}" download>${MB.t('download')}</a></p>
        </section>
        <section class="block">
          <table class="kv max-w-2xl">
            <tr><td>${MB.t('version')}</td><td class="font-mono">${MB.esc(pack.version)}</td></tr>
            <tr><td>${MB.t('author')}</td><td>${MB.esc(pack.author)}</td></tr>
            <tr><td>org</td><td>${MB.esc(pack.org || '—')}</td></tr>
            <tr><td>${MB.t('category')}</td><td>${MB.esc(pack.category)}</td></tr>
            <tr><td>${MB.t('license')}</td><td>${MB.esc(pack.license)}</td></tr>
            <tr><td>${MB.t('consumes')}</td><td class="font-mono">${MB.esc((pack.consumes || []).join(', ')) || '—'}</td></tr>
            <tr><td>${MB.t('languages')}</td><td class="font-mono">${MB.esc((pack.languages || []).join(', '))}</td></tr>
            <tr><td>${MB.t('requiresTopic')}</td><td>${pack.requiresTopic ? MB.t('yes') : MB.t('no')}</td></tr>
            <tr><td>${MB.t('artifactPrefix')}</td><td class="font-mono">${MB.esc(pack.artifactPrefix || '—')}</td></tr>
            <tr><td>${MB.t('added')}</td><td>${MB.esc(MB.fmtDateTime(pack.added))}</td></tr>
            <tr><td>${MB.t('updated')}</td><td>${MB.esc(MB.fmtDateTime(pack.updated))}</td></tr>
          </table>
        </section>
        ${versionRows ? `
        <section class="block">
          <h2>${MB.t('versionsLabel')}</h2>
          <table class="kv max-w-2xl">${versionRows}</table>
        </section>` : ''}`

      MB.header('browse')
    }

    MB.header('browse')
    if (!name) {
      location.href = '/'
    } else {
      MB.api(`/api/packs/${encodeURIComponent(name)}`)
        .then(render)
        .catch(e => {
          document.getElementById('main').innerHTML = `<p class="notice bad">${MB.esc(e.message)}</p>`
          MB.header('browse')
        })
    }
  </script>
</body>
</html>
