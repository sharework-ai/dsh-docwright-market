<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>docwright pack market</title>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <main id="main">
    <p class="muted" data-i18n="loading"></p>
  </main>
  <script src="/vendor/supabase.js"></script>
  <script src="/assets/app.js"></script>
  <script>
    const name = new URLSearchParams(location.search).get('name')

    function render({ suite, members }) {
      if (!suite) {
        document.getElementById('main').innerHTML = `<h1>${MB.t('suiteNotFound')}</h1>`
        return
      }
      document.title = `${suite.name} — docwright pack market`
      const cards = (members || []).map(m => m.missing ? `
        <div class="card">
          <h3>${MB.esc(m.name)} <span class="badge code">${MB.t('missingMember')}</span></h3>
          <div class="desc">${MB.t('membersLabel')} — ${MB.t('missingMember')}</div>
        </div>` : `
        <div class="card cursor-pointer" data-href="/pack.html?name=${encodeURIComponent(m.name)}">
          <h3><a href="/pack.html?name=${encodeURIComponent(m.name)}">${MB.esc(m.name)}</a>
            <span class="font-mono text-[13px] font-semibold text-primary dark:text-accent-strong">@${MB.esc(m.version)}</span></h3>
          <div class="desc">${MB.esc(MB.localizedDesc(m.description))}</div>
          <div class="meta">
            ${(m.consumes || []).map(c => `<span class="chip">${MB.esc(c)}</span>`).join('')}
          </div>
        </div>`).join('')
      document.querySelectorAll('[data-href]').forEach(card => {
        card.addEventListener('click', e => {
          if (e.target.closest('a, button, input')) return
          location.href = card.dataset.href
        })
      })

      document.getElementById('main').innerHTML = `
        <p><a class="chip" href="/">← ${MB.t('browse')}</a></p>
        <h1>${MB.esc(suite.name)}
          <span class="font-mono text-2xl font-semibold text-primary dark:text-accent-strong">@${MB.esc(suite.version)}</span></h1>
        <p class="max-w-xl text-slate-500 dark:text-slate-400">${MB.esc(MB.localizedDesc(suite.description))}</p>
        <section class="block">
          <table class="kv max-w-2xl">
            <tr><td>${MB.t('category')}</td><td>${MB.esc(suite.category)}</td></tr>
            <tr><td>${MB.t('author')}</td><td>${MB.esc(suite.author)}</td></tr>
            <tr><td>${MB.t('updated')}</td><td>${MB.esc(MB.fmtDateTime(suite.updated))}</td></tr>
          </table>
        </section>
        <section class="block">
          <h2>${MB.t('membersLabel')}</h2>
          <div class="grid">${cards}</div>
        </section>
        <section class="block">
          <h2>${MB.t('install')}</h2>
          <div id="install-bridge"></div>
        </section>`
      MB.header('browse')
      MB.mountInstallButton('suite', suite.name, document.getElementById('install-bridge'))
    }

    MB.header('browse')
    if (!name) {
      location.href = '/'
    } else {
      MB.api(`/api/suites/${encodeURIComponent(name)}`)
        .then(render)
        .catch(e => {
          document.getElementById('main').innerHTML = `<p class="notice bad">${MB.esc(e.message)}</p>`
          MB.header('browse')
        })
    }
  </script>
</body>
</html>
