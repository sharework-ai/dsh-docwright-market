<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Packs — docwright pack market</title>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <main>
    <h1 data-i18n="packs"></h1>

    <div id="auth-box" class="card">
      <p class="muted" data-i18n="signInToPublish"></p>
      <label class="field"><span data-i18n="email"></span><input id="email" type="email" autocomplete="email"></label>
      <label class="field"><span data-i18n="password"></span><input id="password" type="password" autocomplete="current-password" minlength="6"></label>
      <div id="auth-error"></div>
      <button id="btn-signin" class="primary" data-i18n="signIn"></button>
      <button id="btn-signup" class="secondary" data-i18n="signUp"></button>
    </div>

    <div id="content" class="hidden">
      <!-- org is read-only here; editing lives on the account page. -->
      <div class="card" style="margin-bottom:1rem">
        <div class="meta" style="margin-top:0">
          <span id="hub-org"></span>
          <a href="/account.html" class="chip" data-i18n="orgEditHint"></a>
          <span style="flex:1"></span>
          <a href="/submit.html" class="btn" data-i18n="submit"></a>
        </div>
      </div>

      <section class="block">
        <h2 data-i18n="myPacks"></h2>
        <p id="my-packs-empty" class="muted hidden" data-i18n="noPacksYet"></p>
        <div id="my-packs"></div>
      </section>

      <section class="block">
        <h2 data-i18n="mySubmissions"></h2>
        <p id="my-subs-empty" class="muted hidden" data-i18n="noSubmissions"></p>
        <div id="my-subs"></div>
      </section>

      <section class="block">
        <h2 data-i18n="mySuites"></h2>
        <p class="muted" style="font-size:0.85rem" data-i18n="suitesIntro"></p>
        <!-- create / edit form: hidden until needed -->
        <div id="suite-form-card" class="card hidden" style="margin-bottom:0.8rem">
          <strong style="font-size:0.85rem" id="suite-form-title"></strong>
          <label class="field"><span data-i18n="suiteName"></span><input id="s-name" placeholder="cosmic"></label>
          <label class="field"><span data-i18n="suiteDescEn"></span><input id="s-desc-en"></label>
          <label class="field"><span data-i18n="suiteDescZh"></span><input id="s-desc-zh"></label>
          <label class="field"><span data-i18n="suiteVersion"></span><input id="s-version" placeholder="1.0.0"></label>
          <label class="field"><span data-i18n="suiteMembers"></span>
            <select id="s-members" multiple style="min-height:8rem"></select>
          </label>
          <div id="s-msg"></div>
          <button id="btn-suite-save" class="primary" data-i18n="createSuite"></button>
          <button id="btn-suite-cancel" class="secondary" data-i18n="cancel"></button>
        </div>
        <p id="my-suites-empty" class="muted hidden" data-i18n="noSuitesYet"></p>
        <div id="my-suites"></div>
        <div class="meta"><button class="secondary" id="btn-new-suite">+ <span data-i18n="mySuites"></span></button></div>
      </section>
    </div>
  </main>
  <script src="/vendor/supabase.js"></script>
  <script src="/assets/app.js"></script>
  <script>
    MB.header('packs')

    // ---- auth gate ----------------------------------------------------------
    function readCreds() {
      const email = document.getElementById('email').value.trim()
      const password = document.getElementById('password').value
      const box = document.getElementById('auth-error')
      if (!email || !password) {
        box.innerHTML = '<div class="notice bad">请先填写邮箱和密码 / fill in email and password first</div>'
        return null
      }
      box.innerHTML = ''
      return { email, password }
    }

    document.getElementById('btn-signin').addEventListener('click', async () => {
      const creds = readCreds()
      if (!creds) return
      const { error } = await MB.supabase.auth.signInWithPassword(creds)
      if (error) alert(error.message)
      else location.reload()
    })

    document.getElementById('btn-signup').addEventListener('click', async () => {
      const creds = readCreds()
      if (!creds) return
      if (creds.password.length < 6) {
        document.getElementById('auth-error').innerHTML =
          '<div class="notice bad">密码至少 6 位 / password needs at least 6 characters</div>'
        return
      }
      const { error } = await MB.supabase.auth.signUp(creds)
      if (error) alert(error.message)
      else location.reload()
    })

    // ---- org read-only display ------------------------------------------------
    async function loadHub() {
      const acc = await MB.api('/api/account', { auth: true })
      document.getElementById('hub-org').innerHTML = acc.org
        ? `<span class="chip">org: ${MB.esc(acc.org)}</span>`
        : `<span class="notice info" style="display:inline-block;padding:0.2rem 0.8rem">${MB.t('orgNone')}</span>`
    }

    // ---- my packs -------------------------------------------------------------
    function chipEl(text) { return `<span class="chip">${MB.esc(text)}</span>` }
    function statusChip(status) {
      return `<span class="chip ${status === 'disabled' ? 'badge code' : ''}">${MB.esc(status)}</span>`
    }

    async function loadMyPacks() {
      const { packs } = await MB.api('/api/my/packs', { auth: true })
      document.getElementById('my-packs-empty').classList.toggle('hidden', packs.length > 0)
      const box = document.getElementById('my-packs')
      box.innerHTML = packs.map(p => `
        <div class="card" style="margin-bottom:0.8rem" data-pack="${MB.esc(p.name)}">
          <h3><a href="/pack.html?name=${encodeURIComponent(p.name)}">${MB.esc(p.name)}</a>@${MB.esc(p.version)}
            ${p.status === 'disabled' ? `<span class="badge code">${MB.t('disabledBadge')}</span>` : ''}
          </h3>
          <div class="meta">${chipEl(p.category)}${chipEl(p.author)}${chipEl(p.license)}${p.org ? chipEl('org: ' + p.org) : ''}
            <a class="chip" href="/tarballs/${MB.esc(p.name)}-${MB.esc(p.version)}.tgz" download title="download tgz">↓ tgz</a>
          </div>
          <div class="meta">
            <button class="secondary" data-act="edit">${MB.t('edit')}</button>
            <button class="secondary" data-act="${p.status === 'disabled' ? 'enable' : 'disable'}">
              ${MB.t(p.status === 'disabled' ? 'enable' : 'disable')}
            </button>
            <button class="danger" data-act="delete">${MB.t('delete')}</button>
          </div>
          <div class="edit-area"></div>
        </div>`).join('')

      box.querySelectorAll('[data-pack]').forEach(card => {
        const name = card.dataset.pack
        card.querySelectorAll('button[data-act]').forEach(btn => {
          btn.addEventListener('click', async () => {
            const act = btn.dataset.act
            if (act === 'edit') return renderEditForm(card, name, packs.find(p => p.name === name))
            if (act === 'disable' || act === 'enable') {
              await MB.api(`/api/my/packs/${encodeURIComponent(name)}/${act}`, { method: 'POST', auth: true })
              await loadMyPacks()
              return
            }
            if (act === 'delete') {
              const typed = prompt(`${MB.t('deleteConfirmPrefix')} "${name}"\n${MB.t('deleteReservedNote')}`)
              if (typed !== name) return
              await MB.api(`/api/my/packs/${encodeURIComponent(name)}`, { method: 'DELETE', auth: true })
              await loadMyPacks()
            }
          })
        })
      })
    }

    function renderEditForm(card, name, p) {
      const area = card.querySelector('.edit-area')
      if (area.innerHTML) { area.innerHTML = ''; return }
      const CATEGORY_WHITELIST = ['estimation', 'dev', 'pm', 'test', 'docs', 'other']
      const LICENSE_WHITELIST = ['MIT', 'Apache-2.0', 'BSD-3-Clause', 'BSD-2-Clause', 'ISC']
      const opt = (list, selected) => list.map(v => `<option value="${v}" ${v === selected ? 'selected' : ''}>${v}</option>`).join('')
      area.innerHTML = `
        <div class="card" style="background:var(--bg); margin-top:0.6rem">
          <strong style="font-size:0.85rem">${MB.t('editMeta')}</strong>
          <label class="field"><span>${MB.t('category')}</span><select class="e-category">${opt(CATEGORY_WHITELIST, p.category)}</select></label>
          <label class="field"><span>${MB.t('license')}</span><select class="e-license">${opt(LICENSE_WHITELIST, p.license)}</select></label>
          <label class="field"><span>${MB.t('author')}</span><input class="e-author" value="${MB.esc(p.author)}"></label>
          <label class="field"><span>${MB.t('homepage')}</span><input class="e-homepage" type="url" placeholder="https://…" value="${MB.esc(p.homepage ?? '')}"></label>
          <div class="e-msg"></div>
          <button class="primary e-save">${MB.t('save')}</button>
          <button class="secondary e-cancel">${MB.t('cancel')}</button>
        </div>`
      area.querySelector('.e-cancel').addEventListener('click', () => { area.innerHTML = '' })
      area.querySelector('.e-save').addEventListener('click', async () => {
        const msg = area.querySelector('.e-msg')
        const homepage = area.querySelector('.e-homepage').value.trim()
        const body = {
          category: area.querySelector('.e-category').value,
          license: area.querySelector('.e-license').value,
          author: area.querySelector('.e-author').value,
          homepage: homepage === '' ? null : homepage,
        }
        try {
          await MB.api(`/api/my/packs/${encodeURIComponent(name)}`, { method: 'PATCH', body, auth: true })
          await loadMyPacks()
        } catch (e) {
          msg.innerHTML = `<div class="notice bad">${MB.esc(e.message)}</div>`
        }
      })
    }

    // ---- my submissions ----------------------------------------------------------
    // The archive endpoint needs the bearer header, so an anchor's plain href
    // can't carry it — fetch bytes, then hand them to the browser as a file.
    async function downloadArchive(id, name, version) {
      const s = await MB.session()
      if (!s) return
      const res = await fetch(`/api/my/submissions/${id}/archive`, {
        headers: { Authorization: `Bearer ${s.access_token}` },
      })
      if (!res.ok) { alert(`download failed: ${res.status}`); return }
      const blob = await res.blob()
      const a = document.createElement('a')
      a.href = URL.createObjectURL(blob)
      a.download = `${name}-${version}.tgz`
      a.click()
      URL.revokeObjectURL(a.href)
    }

    async function loadMySubmissions() {
      const { submissions } = await MB.api('/api/my/submissions', { auth: true })
      document.getElementById('my-subs-empty').classList.toggle('hidden', submissions.length > 0)
      const box = document.getElementById('my-subs')
      box.innerHTML = submissions.map(s => `
        <div class="card" style="margin-bottom:0.6rem">
          <strong>${MB.esc(s.packName)}</strong>@${MB.esc(s.version)}
          ${s.kind === 'suite' ? `<span class="chip">${MB.t('kindSuite')}</span>` : ''}
          ${statusChip(s.status)}
          <span class="muted" style="font-size:0.8rem">${MB.esc(MB.fmtDateTime(s.createdAt))}</span>
          ${s.kind !== 'suite' ? `<a class="chip" href="#" data-arch="${s.id}" data-name="${MB.esc(s.packName)}" data-version="${MB.esc(s.version)}" title="download submitted archive">↓ tgz</a>` : ''}
          ${s.reviewNote ? `<div class="muted" style="font-size:0.85rem">${MB.esc(s.reviewNote)}</div>` : ''}
          ${s.status === 'pending'
            ? `<div class="meta"><button class="danger" data-withdraw="${s.id}">${MB.t('withdraw')}</button></div>`
            : ''}
        </div>`).join('')
      box.querySelectorAll('a[data-arch]').forEach(a => {
        a.addEventListener('click', e => {
          e.preventDefault()
          downloadArchive(a.dataset.arch, a.dataset.name, a.dataset.version)
        })
      })
      box.querySelectorAll('button[data-withdraw]').forEach(btn => {
        btn.addEventListener('click', async () => {
          try {
            await MB.api(`/api/my/submissions/${btn.dataset.withdraw}`, { method: 'DELETE', auth: true })
            await loadMySubmissions()
          } catch (e) {
            alert(e.message)
          }
        })
      })
    }

    // ---- my suites -------------------------------------------------------------
    const CATEGORY_WHITELIST = ['estimation', 'dev', 'pm', 'test', 'docs', 'other']
    let marketPacks = []
    let suiteFormMode = null // null | 'create' | { editing: name }

    function suiteFormValues() {
      return {
        name: document.getElementById('s-name').value.trim(),
        version: document.getElementById('s-version').value.trim(),
        description: {
          en: document.getElementById('s-desc-en').value.trim(),
          zh: document.getElementById('s-desc-zh').value.trim(),
        },
        category: document.getElementById('s-category').value,
        members: [...document.getElementById('s-members').selectedOptions].map(o => o.value),
      }
    }

    function openSuiteForm(mode, suite) {
      suiteFormMode = mode
      const card = document.getElementById('suite-form-card')
      document.getElementById('suite-form-title').textContent =
        mode === 'create' ? MB.t('createSuite') : `${MB.t('editSuite')}: ${suite.name}`
      document.getElementById('s-name').value = mode === 'create' ? '' : suite.name
      document.getElementById('s-name').disabled = mode !== 'create'
      document.getElementById('s-desc-en').value = mode === 'create' ? '' : (suite.description?.en || '')
      document.getElementById('s-desc-zh').value = mode === 'create' ? '' : (suite.description?.zh || '')
      document.getElementById('s-version').value = mode === 'create' ? '' : suite.version
      const members = mode === 'create' ? [] : (suite.members || [])
      document.getElementById('s-members').querySelectorAll('option').forEach(o => {
        o.selected = members.includes(o.value)
      })
      if (mode !== 'create') {
        const cat = document.getElementById('s-category')
        // category rides in suiteMeta only via edit round-trip; keep the current value otherwise
        if (suite.category) cat.value = suite.category
      }
      document.getElementById('s-msg').innerHTML = ''
      card.classList.remove('hidden')
    }

    function closeSuiteForm() {
      suiteFormMode = null
      document.getElementById('suite-form-card').classList.add('hidden')
    }

    document.getElementById('btn-suite-cancel').addEventListener('click', closeSuiteForm)

    document.getElementById('btn-new-suite').addEventListener('click', () => {
      if (suiteFormMode === 'create') return closeSuiteForm()
      openSuiteForm('create')
    })

    document.getElementById('btn-suite-save').addEventListener('click', async () => {
      const msg = document.getElementById('s-msg')
      const body = suiteFormValues()
      try {
        if (suiteFormMode === 'create') {
          await MB.api('/api/my/suites', { method: 'POST', body, auth: true })
          msg.innerHTML = `<div class="notice ok">${MB.esc(MB.t('suiteCreated'))}</div>`
        } else if (suiteFormMode) {
          await MB.api(`/api/my/suites/${encodeURIComponent(suiteFormMode)}`, { method: 'PATCH', body, auth: true })
          msg.innerHTML = `<div class="notice ok">${MB.esc(MB.t('suiteUpdated'))}</div>`
        }
        closeSuiteForm()
        await loadMySuites()
      } catch (e) {
        msg.innerHTML = `<div class="notice bad">${MB.esc(e.message)}</div>`
      }
    })

    async function loadMySuites() {
      // member multi-select data source: the whole public catalog
      marketPacks = (await MB.api('/api/packs').catch(() => ({ packs: [] }))).packs
      const select = document.getElementById('s-members')
      select.innerHTML = marketPacks.map(p => `<option value="${MB.esc(p.name)}">${MB.esc(p.name)}</option>`).join('')
      const cat = document.getElementById('s-category')
      if (!cat) {
        // category select is injected once next to the form fields
        const field = document.createElement('label')
        field.className = 'field'
        field.innerHTML = `<span>${MB.esc(MB.t('category'))}</span>
          <select id="s-category">${CATEGORY_WHITELIST.map(c => `<option value="${c}" ${c === 'dev' ? 'selected' : ''}>${c}</option>`).join('')}</select>`
        document.getElementById('s-version').closest('label.field').after(field)
      }

      const { suites } = await MB.api('/api/my/suites', { auth: true })
      document.getElementById('my-suites-empty').classList.toggle('hidden', suites.length > 0)
      const box = document.getElementById('my-suites')
      box.innerHTML = suites.map(st => `
        <div class="card" style="margin-bottom:0.8rem" data-suite="${MB.esc(st.name)}">
          <h3><a href="/suite.html?name=${encodeURIComponent(st.name)}">${MB.esc(st.name)}</a>@${MB.esc(st.version)}
            ${st.enabled === false ? `<span class="badge code">${MB.t('disabledBadge')}</span>` : ''}
          </h3>
          <div class="desc">${MB.esc(MB.localizedDesc(st.description))}</div>
          <div class="meta">${(st.members || []).map(m => chipEl(m)).join('')}</div>
          <div class="meta">
            <button class="secondary" data-act="edit">${MB.t('edit')}</button>
            <button class="secondary" data-act="${st.enabled === false ? 'enable' : 'disable'}">
              ${MB.t(st.enabled === false ? 'enable' : 'disable')}
            </button>
            <button class="danger" data-act="delete">${MB.t('delete')}</button>
          </div>
        </div>`).join('')

      box.querySelectorAll('[data-suite]').forEach(card => {
        const name = card.dataset.suite
        card.querySelectorAll('button[data-act]').forEach(btn => {
          btn.addEventListener('click', async () => {
            const act = btn.dataset.act
            if (act === 'edit') return openSuiteForm(name, suites.find(st => st.name === name))
            if (act === 'disable' || act === 'enable') {
              await MB.api(`/api/my/suites/${encodeURIComponent(name)}/${act}`, { method: 'POST', auth: true })
              await loadMySuites()
              return
            }
            if (act === 'delete') {
              if (!confirm(`${MB.t('delete')} "${name}"?`)) return
              try {
                const res = await MB.api(`/api/my/suites/${encodeURIComponent(name)}`, { method: 'DELETE', auth: true })
                alert(res.mode === 'withdrawn' ? MB.t('suiteWithdrawn') : MB.t('suiteDeleteQueued'))
                await loadMySuites()
              } catch (e) { alert(e.message) }
            }
          })
        })
      })
    }

    async function maybeShowContent() {
      const s = await MB.session()
      document.getElementById('auth-box').classList.toggle('hidden', !!s)
      document.getElementById('content').classList.toggle('hidden', !s)
      if (!s) return
      await loadHub().catch(() => {})
      await loadMyPacks().catch(() => {})
      await loadMySubmissions().catch(() => {})
      await loadMySuites().catch(() => {})
    }

    maybeShowContent()
  </script>
</body>
</html>
