<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Account — docwright pack market</title>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <main>
    <h1 data-i18n="accountTitle"></h1>
    <p class="muted" data-i18n="accountHint"></p>

    <div id="auth-box" class="card">
      <label class="field"><span data-i18n="email"></span><input id="email" type="email" autocomplete="email"></label>
      <label class="field"><span data-i18n="password"></span><input id="password" type="password" autocomplete="new-password" minlength="6"></label>
      <label class="field"><span data-i18n="confirmPassword"></span><input id="password2" type="password" autocomplete="new-password" minlength="6"></label>
      <div id="auth-error"></div>
      <button id="btn-signin" class="primary" data-i18n="signIn"></button>
      <button id="btn-signup" class="secondary" data-i18n="signUp"></button>
    </div>

    <div id="otp-box" class="card hidden">
      <p id="otp-sent" class="muted text-[13px]"></p>
      <label class="field"><span data-i18n="otpLabel"></span><input id="otp-code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]*"></label>
      <div id="otp-msg"></div>
      <button id="btn-otp-verify" class="primary" data-i18n="otpVerify"></button>
      <button id="btn-otp-resend" class="secondary" data-i18n="otpResend"></button>
    </div>

    <div id="content" class="hidden">
      <section class="block card">
        <h3 data-i18n="passwordTitle"></h3>
        <label class="field"><span data-i18n="currentPassword"></span><input id="cur-password" type="password" autocomplete="current-password" minlength="6"></label>
        <label class="field"><span data-i18n="newPassword"></span><input id="new-password" type="password" autocomplete="new-password" minlength="6"></label>
        <label class="field"><span data-i18n="confirmPassword"></span><input id="new-password2" type="password" autocomplete="new-password" minlength="6"></label>
        <div id="pw-msg"></div>
        <button id="btn-password" class="primary" data-i18n="changePassword"></button>
      </section>

      <section class="block card">
        <h3 data-i18n="emailTitle"></h3>
        <p class="muted text-[13px]" data-i18n="emailHint"></p>
        <p id="email-current" class="muted"></p>
        <label class="field"><span data-i18n="currentPassword"></span><input id="email-password" type="password" autocomplete="current-password" minlength="6"></label>
        <label class="field"><span data-i18n="newEmail"></span><input id="new-email" type="email" autocomplete="email"></label>
        <div id="email-msg"></div>
        <button id="btn-email" class="primary" data-i18n="changeEmail"></button>
      </section>

      <section class="block card">
        <h3 data-i18n="tzTitle"></h3>
        <p class="muted text-[13px]" data-i18n="tzHint"></p>
        <label class="field"><span data-i18n="tzLabel"></span><select id="tz-select"></select></label>
      </section>

      <section class="block card">
        <h3 data-i18n="orgTitle"></h3>
        <p class="muted text-[13px]" data-i18n="orgHint"></p>
        <p id="org-current"><span class="muted" data-i18n="orgNone"></span></p>
        <label class="field"><span data-i18n="orgNew"></span><input id="org-input" placeholder="sharework-ai" pattern="[a-z0-9][a-z0-9-]{0,38}"></label>
        <div id="org-msg"></div>
        <button id="btn-org" class="primary" data-i18n="orgSet"></button>
      </section>
    </div>
  </main>
  <script src="/vendor/supabase.js"></script>
  <script src="/assets/app.js"></script>
  <script>
    MB.header('account')
    MB.renderTimeZonePicker(document.getElementById('tz-select'))

    // ---- shared validation + OTP panel -----------------------------------------
    // Password rule: at least 6 chars, letters AND digits. The OTP panel
    // serves both signup and email-change confirmation — it shows after the
    // request that triggered GoTrue's mail, then verifyOtp finishes the flow.
    const passwordOk = (pw) => typeof pw === 'string' && pw.length >= 6 && /[A-Za-z]/.test(pw) && /\d/.test(pw)

    const otpBox = document.getElementById('otp-box')
    let otpKind = '' // 'signup' | 'email_change' | 'recovery'
    let otpEmail = ''

    function showOtp(kind, mail) {
      otpKind = kind
      otpEmail = mail
      document.getElementById('otp-sent').textContent = MB.t('otpSentSignup').replace('{email}', mail)
      document.getElementById('otp-msg').innerHTML = ''
      document.getElementById('otp-code').value = ''
      otpBox.classList.remove('hidden')
    }

    function hideOtp() {
      otpBox.classList.add('hidden')
      otpKind = ''
      otpEmail = ''
    }

    document.getElementById('btn-otp-verify').addEventListener('click', async () => {
      const msg = document.getElementById('otp-msg')
      const token = document.getElementById('otp-code').value.trim()
      if (!otpKind || !otpEmail) return
      if (!/^\d{6}$/.test(token)) {
        msg.innerHTML = `<div class="notice bad">${MB.esc(MB.t('otpFillRequired'))}</div>`
        return
      }
      try {
        const { error } = await MB.supabase.auth.verifyOtp({ email: otpEmail, token, type: otpKind })
        if (error) throw error
        msg.innerHTML = `<div class="notice ok">${MB.t('otpVerified')}</div>`
        if (otpKind === 'email_change') setTimeout(hideOtp, 1500)
        else setTimeout(() => location.reload(), 1500)
      } catch (e) {
        msg.innerHTML = `<div class="notice bad">${MB.esc(e.message)}</div>`
      }
    })

    document.getElementById('btn-otp-resend').addEventListener('click', async () => {
      const msg = document.getElementById('otp-msg')
      if (!otpKind || !otpEmail) return
      try {
        const { error } = await MB.supabase.auth.resend({ type: otpKind, email: otpEmail })
        if (error) throw error
        msg.innerHTML = `<div class="notice ok">${MB.t('otpResent')}</div>`
      } catch (e) {
        msg.innerHTML = `<div class="notice bad">${MB.esc(e.message)}</div>`
      }
    })

    // ---- auth gate (same pattern as submit.html) ------------------------------
    function readCreds() {
      const email = document.getElementById('email').value.trim()
      const password = document.getElementById('password').value
      const password2 = document.getElementById('password2').value
      const box = document.getElementById('auth-error')
      if (!email || !password) {
        box.innerHTML = `<div class="notice bad">${MB.esc(MB.t('authFill'))}</div>`
        return null
      }
      box.innerHTML = ''
      return { email, password, password2 }
    }

    document.getElementById('btn-signin').addEventListener('click', async () => {
      const creds = readCreds()
      if (!creds) return
      const { error } = await MB.supabase.auth.signInWithPassword({ email: creds.email, password: creds.password })
      if (error) alert(error.message)
      else location.reload()
    })

    document.getElementById('btn-signup').addEventListener('click', async () => {
      const box = document.getElementById('auth-error')
      const creds = readCreds()
      if (!creds) return
      if (creds.password !== creds.password2) {
        box.innerHTML = `<div class="notice bad">${MB.esc(MB.t('passwordMismatch'))}</div>`
        return
      }
      if (!passwordOk(creds.password)) {
        box.innerHTML = `<div class="notice bad">${MB.esc(MB.t('passwordWeak'))}</div>`
        return
      }
      const { data, error } = await MB.supabase.auth.signUp({ email: creds.email, password: creds.password })
      if (error) { alert(error.message); return }
      // No session = confirmation required (MAILER_AUTOCONFIRM off): the code
      // went to the mailbox, the OTP panel finishes the signup.
      if (!data.session) {
        document.getElementById('auth-box').classList.add('hidden')
        showOtp('signup', creds.email)
        box.innerHTML = `<div class="notice info">${MB.esc(MB.t('signupNeedsConfirm'))}</div>`
      } else {
        location.reload()
      }
    })

    // ---- password card ---------------------------------------------------------
    document.getElementById('btn-password').addEventListener('click', async () => {
      const msg = document.getElementById('pw-msg')
      const email = (await MB.session())?.user?.email
      const current = document.getElementById('cur-password').value
      const next = document.getElementById('new-password').value
      const next2 = document.getElementById('new-password2').value
      if (!email || !current || !next) {
        msg.innerHTML = `<div class="notice bad">${MB.esc(MB.t('pwFillRequired'))}</div>`
        return
      }
      if (next !== next2) {
        msg.innerHTML = `<div class="notice bad">${MB.esc(MB.t('passwordMismatch'))}</div>`
        return
      }
      if (!passwordOk(next)) {
        msg.innerHTML = `<div class="notice bad">${MB.esc(MB.t('passwordWeak'))}</div>`
        return
      }
      try {
        // Verify the current password by signing in with it — GoTrue answers
        // invalid-credentials on a mismatch; this also refreshes the session.
        const { error } = await MB.supabase.auth.signInWithPassword({ email, password: current })
        if (error) throw new Error(MB.t('currentPassword') + ': ' + error.message)
        const { error: updateError } = await MB.supabase.auth.updateUser({ password: next })
        if (updateError) throw updateError
        msg.innerHTML = `<div class="notice ok">${MB.t('passwordChanged')}</div>`
        setTimeout(async () => {
          await MB.supabase.auth.signOut()
          location.reload()
        }, 1500)
      } catch (e) {
        msg.innerHTML = `<div class="notice bad">${MB.esc(e.message)}</div>`
      }
    })

    // ---- email card -------------------------------------------------------------
    // The account is keyed by the internal auth id; the email is only the login
    // handle. Verify the current password first (same trick as the password
    // card), then updateUser asks GoTrue to mail a confirmation code to the NEW
    // address; the OTP panel (type email_change) finishes the change. Existing
    // mailboxes and packs follow the internal id, not the address.
    let currentEmail = ''
    async function loadEmail() {
      currentEmail = (await MB.session())?.user?.email ?? ''
      document.getElementById('email-current').textContent = currentEmail
        ? `${MB.t('currentEmail')}: ${currentEmail}`
        : ''
    }

    document.getElementById('btn-email').addEventListener('click', async () => {
      const msg = document.getElementById('email-msg')
      const current = document.getElementById('email-password').value
      const next = document.getElementById('new-email').value.trim()
      if (!currentEmail || !current || !next) {
        msg.innerHTML = `<div class="notice bad">${MB.esc(MB.t('emailFillRequired'))}</div>`
        return
      }
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(next)) {
        msg.innerHTML = `<div class="notice bad">${MB.esc(MB.t('emailInvalid'))}</div>`
        return
      }
      if (next === currentEmail) {
        msg.innerHTML = `<div class="notice bad">${MB.esc(MB.t('emailInvalid'))}</div>`
        return
      }
      try {
        // Verify the current password by signing in with it — GoTrue answers
        // invalid-credentials on a mismatch; this also refreshes the session.
        const { error } = await MB.supabase.auth.signInWithPassword({ email: currentEmail, password: current })
        if (error) throw new Error(MB.t('currentPassword') + ': ' + error.message)
        const { error: updateError } = await MB.supabase.auth.updateUser({ email: next })
        if (updateError) throw updateError
        msg.innerHTML = `<div class="notice ok">${MB.t('emailChangedSent')}</div>`
        showOtp('email_change', next)
      } catch (e) {
        msg.innerHTML = `<div class="notice bad">${MB.esc(e.message)}</div>`
      }
    })

    // ---- org card ---------------------------------------------------------------
    async function loadOrg() {
      const acc = await MB.api('/api/account', { auth: true })
      document.getElementById('org-current').innerHTML = acc.org
        ? `<strong>${MB.esc(acc.org)}</strong> <span class="muted">(${MB.esc(acc.email ?? '')})</span>`
        : `<span class="notice info !inline-block !my-0">${MB.t('orgNone')}</span>`
      if (acc.org) document.getElementById('org-input').placeholder = acc.org
    }

    document.getElementById('btn-org').addEventListener('click', async () => {
      const msg = document.getElementById('org-msg')
      const org = document.getElementById('org-input').value.trim()
      if (!/^[a-z0-9][a-z0-9-]{0,38}$/.test(org)) {
        msg.innerHTML = `<div class="notice bad">${MB.t('orgInvalid')}</div>`
        return
      }
      // Changing the org relabels every owned pack — make the cascade visible
      // before it happens.
      let packCount = 0
      try {
        const mine = await MB.api('/api/my/packs', { auth: true })
        packCount = mine.packs.length
      } catch { /* the PUT still works; the preview is best-effort */ }
      const verb = packCount > 0 ? `${packCount}` : '0'
      if (!confirm(`${MB.t('orgTitle')}: ${org}\n${MB.t('orgConfirm')(verb)}`)) return
      try {
        const res = await MB.api('/api/account/org', { method: 'PUT', body: { org }, auth: true })
        msg.innerHTML = `<div class="notice ok">${MB.t('orgChanged')(res.packsAffected)}</div>`
        await loadOrg()
      } catch (e) {
        const text = /already taken/.test(e.message) ? MB.t('orgTaken') : e.message
        msg.innerHTML = `<div class="notice bad">${MB.esc(text)}</div>`
      }
    })

    async function maybeShowContent() {
      const s = await MB.session()
      document.getElementById('auth-box').classList.toggle('hidden', !!s)
      document.getElementById('content').classList.toggle('hidden', !s)
      if (s) {
        await loadOrg().catch(() => {})
        await loadEmail().catch(() => {})
        return
      }
      // A signup started on another page (submit/packs) lands here to finish
      // confirmation: prefill the email and open the OTP panel directly.
      const confirmHash = /^#confirm=(.+)$/.exec(location.hash)
      if (confirmHash) {
        const mail = decodeURIComponent(confirmHash[1])
        document.getElementById('email').value = mail
        document.getElementById('auth-box').classList.add('hidden')
        showOtp('signup', mail)
        document.getElementById('auth-error').innerHTML =
          `<div class="notice info">${MB.esc(MB.t('signupConfirmThere'))}</div>`
      }
    }

    maybeShowContent()

    // A signup started on another page (submit/packs) lands here to finish
    // confirmation: prefill the email and open the OTP panel directly.
    const confirmHash = /^#confirm=(.+)$/.exec(location.hash)
  </script>
</body>
</html>
