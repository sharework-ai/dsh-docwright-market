<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Account — docwright pack market</title>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <main>
    <h1 data-i18n="accountTitle"></h1>
    <p class="muted" data-i18n="accountHint"></p>

    <div id="auth-box" class="card">
      <label class="field"><span data-i18n="email"></span><input id="email" type="email" autocomplete="email"></label>
      <label class="field"><span data-i18n="password"></span><input id="password" type="password" autocomplete="current-password" minlength="6"></label>
      <div id="auth-error"></div>
      <button id="btn-signin" class="primary" data-i18n="signIn"></button>
      <button id="btn-signup" class="secondary" data-i18n="signUp"></button>
    </div>

    <div id="content" class="hidden">
      <section class="block card">
        <h3 data-i18n="passwordTitle"></h3>
        <label class="field"><span data-i18n="currentPassword"></span><input id="cur-password" type="password" autocomplete="current-password" minlength="6"></label>
        <label class="field"><span data-i18n="newPassword"></span><input id="new-password" type="password" autocomplete="new-password" minlength="6"></label>
        <div id="pw-msg"></div>
        <button id="btn-password" class="primary" data-i18n="changePassword"></button>
      </section>

      <section class="block card">
        <h3 data-i18n="tzTitle"></h3>
        <p class="muted" style="font-size:0.85rem" data-i18n="tzHint"></p>
        <label class="field"><span data-i18n="tzLabel"></span><select id="tz-select"></select></label>
      </section>

      <section class="block card">
        <h3 data-i18n="orgTitle"></h3>
        <p class="muted" style="font-size:0.85rem" data-i18n="orgHint"></p>
        <p id="org-current"><span class="muted" data-i18n="orgNone"></span></p>
        <label class="field"><span data-i18n="orgNew"></span><input id="org-input" placeholder="sharework-ai" pattern="[a-z0-9][a-z0-9-]{0,38}"></label>
        <div id="org-msg"></div>
        <button id="btn-org" class="primary" data-i18n="orgSet"></button>
      </section>
    </div>
  </main>
  <script src="/vendor/supabase.js"></script>
  <script src="/assets/app.js"></script>
  <script>
    MB.header('account')
    MB.renderTimeZonePicker(document.getElementById('tz-select'))

    // ---- auth gate (same pattern as submit.html) ------------------------------
    function readCreds() {
      const email = document.getElementById('email').value.trim()
      const password = document.getElementById('password').value
      const box = document.getElementById('auth-error')
      if (!email || !password) {
        box.innerHTML = '<div class="notice bad">请先填写邮箱和密码 / fill in email and password first</div>'
        return null
      }
      box.innerHTML = ''
      return { email, password }
    }

    document.getElementById('btn-signin').addEventListener('click', async () => {
      const creds = readCreds()
      if (!creds) return
      const { error } = await MB.supabase.auth.signInWithPassword(creds)
      if (error) alert(error.message)
      else location.reload()
    })

    document.getElementById('btn-signup').addEventListener('click', async () => {
      const creds = readCreds()
      if (!creds) return
      if (creds.password.length < 6) {
        document.getElementById('auth-error').innerHTML =
          '<div class="notice bad">密码至少 6 位 / password needs at least 6 characters</div>'
        return
      }
      const { error } = await MB.supabase.auth.signUp(creds)
      if (error) alert(error.message)
      else location.reload()
    })

    // ---- password card ---------------------------------------------------------
    document.getElementById('btn-password').addEventListener('click', async () => {
      const msg = document.getElementById('pw-msg')
      const email = (await MB.session())?.user?.email
      const current = document.getElementById('cur-password').value
      const next = document.getElementById('new-password').value
      if (!email || !current || next.length < 6) {
        msg.innerHTML = '<div class="notice bad">填写当前密码,新密码至少 6 位 / current password + new (min 6) required</div>'
        return
      }
      try {
        // Verify the current password by signing in with it — GoTrue answers
        // invalid-credentials on a mismatch; this also refreshes the session.
        const { error } = await MB.supabase.auth.signInWithPassword({ email, password: current })
        if (error) throw new Error(MB.t('currentPassword') + ': ' + error.message)
        const { error: updateError } = await MB.supabase.auth.updateUser({ password: next })
        if (updateError) throw updateError
        msg.innerHTML = `<div class="notice ok">${MB.t('passwordChanged')}</div>`
        setTimeout(async () => {
          await MB.supabase.auth.signOut()
          location.reload()
        }, 1500)
      } catch (e) {
        msg.innerHTML = `<div class="notice bad">${MB.esc(e.message)}</div>`
      }
    })

    // ---- org card ---------------------------------------------------------------
    async function loadOrg() {
      const acc = await MB.api('/api/account', { auth: true })
      document.getElementById('org-current').innerHTML = acc.org
        ? `<strong>${MB.esc(acc.org)}</strong> <span class="muted">(${MB.esc(acc.email ?? '')})</span>`
        : `<span class="notice info" style="display:inline-block">${MB.t('orgNone')}</span>`
      if (acc.org) document.getElementById('org-input').placeholder = acc.org
    }

    document.getElementById('btn-org').addEventListener('click', async () => {
      const msg = document.getElementById('org-msg')
      const org = document.getElementById('org-input').value.trim()
      if (!/^[a-z0-9][a-z0-9-]{0,38}$/.test(org)) {
        msg.innerHTML = `<div class="notice bad">${MB.t('orgInvalid')}</div>`
        return
      }
      // Changing the org relabels every owned pack — make the cascade visible
      // before it happens.
      let packCount = 0
      try {
        const mine = await MB.api('/api/my/packs', { auth: true })
        packCount = mine.packs.length
      } catch { /* the PUT still works; the preview is best-effort */ }
      const verb = packCount > 0 ? `${packCount}` : '0'
      if (!confirm(`${MB.t('orgTitle')}: ${org}\n${MB.t('orgConfirm')(verb)}`)) return
      try {
        const res = await MB.api('/api/account/org', { method: 'PUT', body: { org }, auth: true })
        msg.innerHTML = `<div class="notice ok">${MB.t('orgChanged')(res.packsAffected)}</div>`
        await loadOrg()
      } catch (e) {
        const text = /already taken/.test(e.message) ? MB.t('orgTaken') : e.message
        msg.innerHTML = `<div class="notice bad">${MB.esc(text)}</div>`
      }
    })

    async function maybeShowContent() {
      const s = await MB.session()
      document.getElementById('auth-box').classList.toggle('hidden', !!s)
      document.getElementById('content').classList.toggle('hidden', !s)
      if (!s) return
      await loadOrg().catch(() => {})
    }

    maybeShowContent()
  </script>
</body>
</html>
